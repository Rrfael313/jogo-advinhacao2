
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Jogo de Adivinhação</h1>

        <p>
            Tente adivinhar o número secreto entre 1 e 100!
            Você tem 10 tentativas.
        </p>

        <input
            type="number"
            id="palpite"
            min="1"
            max="100"
            step="1"
            placeholder="Digite seu número"
        >

        <button id="botaoChutar" onclick="chutar()">Chutar</button>

        <p id="mensagem">Boa sorte!</p>

        <p id="tentativas">Tentativas restantes: 10</p>

        <button onclick="reiniciar()" id="botaoReiniciar">
            Jogar novamente
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
